name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Verify tag matches Directory.Build.props
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          [xml]$props = Get-Content .\Directory.Build.props
          $version = @($props.Project.PropertyGroup.Version) | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Version $version in Directory.Build.props"
          }

      - name: Restore
        run: dotnet restore PCLDownloadFix.sln

      - name: Fetch Android tools for FCL patching
        shell: pwsh
        run: .\tools\fetch-android-tools.ps1

      - name: Build, test and package
        shell: pwsh
        run: .\build.ps1

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
